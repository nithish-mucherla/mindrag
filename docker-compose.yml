version: "3.9"

services:
  mindrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindrag-app
    ports:
      - "8000:8000"
    environment:
      # Load from .env.docker file (see below)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - COHERE_EMBED_MODEL=${COHERE_EMBED_MODEL:-embed-english-light-v3.0}
      - TOP_K=${TOP_K:-5}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-mindrag_psychoeducation}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
